services:

  postgres:
    image: postgres:18
    container_name: datatripwire-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - datatripwire-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: datatripwire-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AI_SERVICE_URL: ${AI_SERVICE_URL}
    ports:
      - "${BACKEND_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    volumes:
      - ./backups:/app/backups

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: datatripwire-ai
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${AI_SERVICE_PORT}:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: datatripwire-frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT}:5173"
    depends_on:
      - backend

volumes:
  datatripwire-postgres-data:
    name: datatripwire-postgres-data
